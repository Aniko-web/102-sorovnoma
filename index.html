<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>102-guruh so'rovnomasi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #fff;
            background: #0f0c29;
            overflow-x: hidden
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden
        }

        .bg i {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .55;
            animation: fl 14s ease-in-out infinite alternate
        }

        .bg i:nth-child(1) {
            width: 380px;
            height: 380px;
            background: #ff3d81;
            top: -80px;
            left: -80px
        }

        .bg i:nth-child(2) {
            width: 420px;
            height: 420px;
            background: #4f8cff;
            bottom: -120px;
            right: -80px;
            animation-delay: -5s
        }

        .bg i:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #a855f7;
            top: 40%;
            left: 55%;
            animation-delay: -9s
        }

        @keyframes fl {
            to {
                transform: translate(60px, -50px) scale(1.2)
            }
        }

        .card {
            width: 100%;
            max-width: 560px;
            padding: 30px 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
            text-align: center
        }

        .screen {
            display: none;
            animation: in .6s cubic-bezier(.2, .9, .3, 1.2)
        }

        .screen.on {
            display: block
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96)
            }
        }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .15);
            font-size: 13px;
            letter-spacing: .5px;
            margin-bottom: 14px
        }

        h1 {
            font-size: clamp(22px, 5vw, 28px);
            line-height: 1.3;
            margin-bottom: 22px
        }

        .emoji {
            font-size: 54px;
            display: block;
            margin-bottom: 10px;
            animation: bob 2.4s ease-in-out infinite
        }

        @keyframes bob {
            50% {
                transform: translateY(-10px) rotate(6deg)
            }
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: 0;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: .25s;
            position: relative;
            overflow: hidden
        }

        .yes {
            background: linear-gradient(90deg, #ff3d81, #ff8a3d)
        }

        .no {
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .25)
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 61, 129, .35)
        }

        .btn:active {
            transform: scale(.97)
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .opt {
            height: 150px;
            border-radius: 20px;
            border: 0;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 14px 8px;
            background: linear-gradient(to top, rgba(0, 0, 0, .8), rgba(0, 0, 0, .05) 65%), var(--img) center/cover;
            transition: transform .35s, box-shadow .35s, background-size .5s;
            background-size: cover;
            opacity: 0;
            animation: pop .6s forwards;
            text-shadow: 0 2px 8px #000
        }

        .opt:nth-child(1) {
            animation-delay: .1s
        }

        .opt:nth-child(2) {
            animation-delay: .25s
        }

        .opt:nth-child(3) {
            animation-delay: .4s
        }

        .opt:nth-child(4) {
            animation-delay: .55s
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.6) rotate(-6deg)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .opt:hover {
            transform: translateY(-6px) scale(1.04) rotate(-1deg);
            box-shadow: 0 14px 30px rgba(0, 0, 0, .5)
        }

        .opt.sel {
            outline: 4px solid #ff3d81;
            transform: scale(1.07);
            box-shadow: 0 0 35px #ff3d81
        }

        .grid.done .opt:not(.sel) {
            opacity: .3;
            transform: scale(.9);
            pointer-events: none;
            transition: .5s
        }

        .ok {
            font-size: 70px;
            display: block;
            animation: tada 1s
        }

        @keyframes tada {
            0% {
                transform: scale(0)
            }

            60% {
                transform: scale(1.3) rotate(10deg)
            }

            100% {
                transform: scale(1)
            }
        }

        p {
            opacity: .85;
            line-height: 1.5
        }

        .c {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 14px;
            z-index: 9;
            animation: fall linear forwards;
            pointer-events: none
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg)
            }
        }

        .bar {
            text-align: left;
            margin: 12px 0
        }

        .bar b {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 5px
        }

        .tr {
            height: 14px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .15);
            overflow: hidden
        }

        .fl {
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, #ff3d81, #ff8a3d);
            transition: width 1.2s cubic-bezier(.2, .9, .3, 1)
        }

        .fl.me {
            background: linear-gradient(90deg, #3dffb0, #4f8cff)
        }

        h2 {
            font-size: 17px;
            margin: 20px 0 4px;
            text-align: left;
            opacity: .9
        }

        .sm {
            font-size: 13px;
            opacity: .7;
            margin-top: 14px
        }

        @media(max-width:420px) {
            .opt {
                height: 125px;
                font-size: 14px
            }
        }
    </style>
</head>

        <div class="screen" id="s5"><span class="ok" id="r_e">📊</span>
            <h1 id="r_t">Natijalar</h1>
            <div id="r_b"></div>
            <p class="sm" id="r_n"></p>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        // ============================================================
        // 1. FIREBASE SOZLAMALARI (O'zingizning Firebase loyihangizdan olingan ma'lumotlarni qo'ying)
        // Agar hali Firebase ulanmagan bo'lsa, lokal (localStorage) rejimida ishlaydi.
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD2rw-oFCaaq_MBMisUXtJYjgGju8wC7oE",
            authDomain: "sorovnoma-12c5f.firebaseapp.com",
            projectId: "sorovnoma-12c5f",
            storageBucket: "sorovnoma-12c5f.firebasestorage.app",
            messagingSenderId: "527399720792",
            appId: "1:527399720792:web:77fc6adcef63e36843372d",
            measurementId: "G-8FBYKBSBD9"
        };

        const PL = ["Muzda uchish", "Kino", "Islom sivilizatsiyasi markazi", "Bowling"];
        const PN = { "Muzda uchish": "⛸️ Muzda uchishga", "Kino": "🎬 Kino ko'rishga", "Islom sivilizatsiyasi markazi": "🕌 Islom sivilizatsiyasi markaziga", "Bowling": "🎳 Bowling o'ynashga" };
        let col = null, ref = null, mine = null, unsub = null, all = [], LK = "guruh102_ovoz", UID_KEY = "guruh102_uid";

        // Unikal foydalanuvchi identifikatori (bir kishi qayta ovoz berolmasligi uchun)
        let voterId = localStorage.getItem(UID_KEY);
        if (!voterId) {
            voterId = 'voter_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now();
            localStorage.setItem(UID_KEY, voterId);
        }

        function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); document.getElementById(id).classList.add("on") }
        function confetti() { const c = ["#ff3d81", "#ff8a3d", "#4f8cff", "#a855f7", "#ffd23d", "#3dffb0"]; for (let i = 0; i < 70; i++) { const d = document.createElement("div"); d.className = "c"; d.style.left = Math.random() * 100 + "vw"; d.style.background = c[i % 6]; d.style.animationDuration = (2 + Math.random() * 2.5) + "s"; d.style.animationDelay = Math.random() * .6 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 5500) } }

        async function save(v) {
            mine = v;
            try { localStorage.setItem(LK, JSON.stringify(v)); } catch (e) { }
            if (ref) {
                try {
                    await ref.set({ ...v, voterId: voterId, vaqt: new Date().toISOString() });
                } catch (e) {
                    console.warn("Bazada saqlashda xatolik:", e);
                }
            }
        }

        function bar(t, n, tot, me) { const p = tot ? Math.round(n * 100 / tot) : 0; return '<div class="bar"><b><span>' + t + (me ? ' ← sizning ovozingiz' : '') + '</span><span>' + p + '% (' + n + ')</span></b><div class="tr"><div class="fl' + (me ? ' me' : '') + '" data-w="' + p + '"></div></div></div>' }

        function draw() {
            const tot = all.length || (mine ? 1 : 0), list = all.length ? all : (mine ? [mine] : []);
            const ha = list.filter(v => v.javob === "Ha"), yoq = list.length - ha.length;
            let o = '<h2>Guruh bilan borishga rozimisiz?</h2>' + bar("Ha, boraman", ha.length, tot, mine && mine.javob === "Ha") + bar("Vaqtim yo'q", yoq, tot, mine && mine.javob !== "Ha");
            o += '<h2>Qayerga borishni istaysiz? (' + ha.length + ' ta "Ha" orasida)</h2>';
            PL.forEach(p => { o += bar(PN[p], ha.filter(v => v.joy === p).length, ha.length, mine && mine.joy === p) });
            document.getElementById("r_b").innerHTML = o;
            document.getElementById("r_n").textContent = "Jami ovoz berganlar: " + tot + " kishi";
            requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".fl").forEach(f => f.style.width = f.dataset.w + "%"), 60));
        }

        function natija(already) {
            document.getElementById("r_t").textContent = already ? "Siz allaqachon ovoz bergansiz" : "Jami ovozlar natijasi";
            document.getElementById("r_e").textContent = already ? "✅" : "📊";
            draw(); show("s5");
            if (col && !unsub) {
                unsub = col.onSnapshot(s => {
                    all = s.docs.map(d => d.data());
                    draw();
                }, err => console.warn("Snapshot xatosi:", err));
            }
        }

        function ha() {
            if (mine) { natija(true); return; }
            show("s2");
        }

        async function yoq() {
            if (mine) { natija(true); return; }
            await save({ javob: "Yoq" });
            show("s3");
        }

        async function tanla(el, joy) {
            if (mine) { natija(true); return; }
            document.getElementById("g").classList.add("done");
            el.classList.add("sel");
            await save({ javob: "Ha", joy: joy });
            setTimeout(() => { natija(false); confetti() }, 900);
        }

        // Boshlang'ich yuklanish
        (async function init() {
            show("s1");

            // 1. Mahalliy xotiradan tekshirish
            try {
                const l = localStorage.getItem(LK);
                if (l) mine = JSON.parse(l);
            } catch (e) { }

            // 2. Firebase ulanishi
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                try {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    const db = firebase.firestore();
                    col = db.collection("guruh102_ovozlar");
                    ref = col.doc(voterId);

                    // Agar bazada bu foydalanuvchining ovozi bo'lsa
                    const doc = await ref.get();
                    if (doc.exists) {
                        mine = doc.data();
                        try { localStorage.setItem(LK, JSON.stringify(mine)); } catch (e) { }
                    }

                    // Barcha ovozlarni yuklab olish
                    const allDocs = await col.get();
                    all = allDocs.docs.map(d => d.data());
                } catch (err) {
                    console.warn("Firebase ulanishida ogohlantirish:", err);
                }
            }

            // Agar foydalanuvchi allaqachon ovoz bergan bo'lsa, to'g'ridan-to'g'ri natijaga o'tkazish
            if (mine) {
                natija(true);
            }
        })();
    </script>
</body>

</html>
